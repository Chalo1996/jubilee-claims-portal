version: '3.9'

services:

  db:
    image: postgres:16-alpine
    container_name: claims_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-claims_portal}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-claims_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claims_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV:       production
      PORT:           5000
      DB_HOST:        db
      DB_PORT:        5432
      DB_NAME:        ${DB_NAME:-claims_portal}
      DB_USER:        ${DB_USER:-postgres}
      DB_PASSWORD:    ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET:     ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN:    ${CORS_ORIGIN:-http://localhost}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claims_migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-claims_portal}
      DB_USER:     ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    command: ["node", "src/db/migrate.js"]
    restart: "no"

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claims_seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-claims_portal}
      DB_USER:     ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    command: ["node", "src/db/seed.js"]
    restart: "no"
    profiles:
      - seed

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claims_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
