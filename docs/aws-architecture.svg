<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="860" viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="860" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Jubilee Claims Portal — AWS Production Architecture</text>
  <text x="600" y="58" text-anchor="middle" font-size="12" fill="#64748b">High Availability · Auto-scaling · Multi-AZ · Least Privilege</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ZONE: Internet / Users -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="20" y="75" width="160" height="110" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="98" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">USERS</text>
  <rect x="35" y="108" width="56" height="40" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="63" y="122" text-anchor="middle" font-size="9" fill="#1d4ed8">Browser</text>
  <text x="63" y="135" text-anchor="middle" font-size="8" fill="#3b82f6">SPA (React)</text>
  <rect x="109" y="108" width="56" height="40" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="137" y="122" text-anchor="middle" font-size="9" fill="#1d4ed8">Mobile</text>
  <text x="137" y="135" text-anchor="middle" font-size="8" fill="#3b82f6">API Client</text>
  <text x="100" y="175" text-anchor="middle" font-size="9" fill="#64748b">HTTPS only</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ZONE: AWS Edge -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="200" y="75" width="180" height="110" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="98" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">AWS EDGE</text>
  <rect x="215" y="108" width="68" height="40" rx="6" fill="#fef9c3" stroke="#fde68a" stroke-width="1"/>
  <text x="249" y="122" text-anchor="middle" font-size="9" fill="#78350f">Route 53</text>
  <text x="249" y="135" text-anchor="middle" font-size="8" fill="#92400e">DNS + Health</text>
  <rect x="295" y="108" width="70" height="40" rx="6" fill="#fef9c3" stroke="#fde68a" stroke-width="1"/>
  <text x="330" y="122" text-anchor="middle" font-size="9" fill="#78350f">CloudFront</text>
  <text x="330" y="135" text-anchor="middle" font-size="8" fill="#92400e">CDN + WAF</text>
  <text x="290" y="175" text-anchor="middle" font-size="9" fill="#64748b">TLS termination · DDoS protection</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- VPC outer box -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="20" y="210" width="1160" height="580" rx="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="34" y="228" font-size="11" font-weight="600" fill="#475569">VPC  10.0.0.0/16</text>

  <!-- ── Public Subnets ── -->
  <rect x="35" y="235" width="530" height="130" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="300" y="254" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">PUBLIC SUBNETS  (us-east-1a / 1b)</text>

  <!-- ALB -->
  <rect x="50" y="263" width="240" height="88" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1" filter="url(#shadow)"/>
  <text x="170" y="281" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Application Load Balancer</text>
  <text x="170" y="295" text-anchor="middle" font-size="9" fill="#166534">HTTPS :443  →  HTTP :5000</text>
  <text x="170" y="308" text-anchor="middle" font-size="9" fill="#166534">Path routing: /api/* → ECS · /* → S3</text>
  <text x="170" y="321" text-anchor="middle" font-size="9" fill="#166534">Target Group health check: /health</text>
  <text x="170" y="337" text-anchor="middle" font-size="9" fill="#166534">WAF rules attached</text>

  <!-- NAT GW -->
  <rect x="310" y="263" width="240" height="88" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1" filter="url(#shadow)"/>
  <text x="430" y="281" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">NAT Gateway (x2, one per AZ)</text>
  <text x="430" y="295" text-anchor="middle" font-size="9" fill="#166534">Elastic IP attached</text>
  <text x="430" y="308" text-anchor="middle" font-size="9" fill="#166534">Outbound traffic from private subnets</text>
  <text x="430" y="321" text-anchor="middle" font-size="9" fill="#166534">(DB updates, SES, SQS endpoints)</text>

  <!-- ── Private Subnets: App ── -->
  <rect x="35" y="385" width="530" height="150" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="300" y="404" text-anchor="middle" font-size="10" font-weight="600" fill="#1e3a8a">PRIVATE SUBNETS — APP  (us-east-1a / 1b)</text>

  <!-- ECS Cluster -->
  <rect x="50" y="413" width="240" height="110" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1" filter="url(#shadow)"/>
  <text x="170" y="431" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">ECS Fargate Cluster</text>
  <text x="170" y="445" text-anchor="middle" font-size="9" fill="#1e3a8a">claims-api service  ×2 tasks min</text>
  <text x="170" y="459" text-anchor="middle" font-size="9" fill="#1e3a8a">Task: node:20-alpine  512MB / 0.25vCPU</text>
  <text x="170" y="473" text-anchor="middle" font-size="9" fill="#1e3a8a">Auto-scaling: CPU 60% target</text>
  <text x="170" y="487" text-anchor="middle" font-size="9" fill="#1e3a8a">Secrets via SSM Parameter Store</text>
  <text x="170" y="501" text-anchor="middle" font-size="9" fill="#1e3a8a">ECR image: claims-portal/backend</text>

  <!-- API GW (optional) -->
  <rect x="310" y="413" width="240" height="110" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1" filter="url(#shadow)"/>
  <text x="430" y="431" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">API Gateway (optional)</text>
  <text x="430" y="445" text-anchor="middle" font-size="9" fill="#1e3a8a">Rate limiting per IP/user</text>
  <text x="430" y="459" text-anchor="middle" font-size="9" fill="#1e3a8a">Request throttling: 1000 req/s</text>
  <text x="430" y="473" text-anchor="middle" font-size="9" fill="#1e3a8a">Usage plans for API consumers</text>
  <text x="430" y="487" text-anchor="middle" font-size="9" fill="#1e3a8a">Caching for GET /policies (TTL 5m)</text>

  <!-- ── Private Subnets: Data ── -->
  <rect x="35" y="555" width="530" height="220" rx="8" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.5"/>
  <text x="300" y="574" text-anchor="middle" font-size="10" font-weight="600" fill="#701a75">PRIVATE SUBNETS — DATA  (us-east-1a / 1b)</text>

  <!-- RDS -->
  <rect x="50" y="583" width="240" height="80" rx="6" fill="#fae8ff" stroke="#d946ef" stroke-width="1" filter="url(#shadow)"/>
  <text x="170" y="601" text-anchor="middle" font-size="10" font-weight="600" fill="#701a75">RDS Aurora PostgreSQL</text>
  <text x="170" y="615" text-anchor="middle" font-size="9" fill="#86198f">Multi-AZ: 1 writer + 1 reader replica</text>
  <text x="170" y="629" text-anchor="middle" font-size="9" fill="#86198f">Automated backups  ·  7-day retention</text>
  <text x="170" y="643" text-anchor="middle" font-size="9" fill="#86198f">Encryption at rest (KMS)</text>
  <text x="170" y="657" text-anchor="middle" font-size="9" fill="#86198f">db.t4g.medium  ·  encrypted storage</text>

  <!-- ElastiCache -->
  <rect x="310" y="583" width="240" height="80" rx="6" fill="#fae8ff" stroke="#d946ef" stroke-width="1" filter="url(#shadow)"/>
  <text x="430" y="601" text-anchor="middle" font-size="10" font-weight="600" fill="#701a75">ElastiCache Redis</text>
  <text x="430" y="615" text-anchor="middle" font-size="9" fill="#86198f">Session cache  ·  GET /policies TTL</text>
  <text x="430" y="629" text-anchor="middle" font-size="9" fill="#86198f">2 nodes (primary + replica)</text>
  <text x="430" y="643" text-anchor="middle" font-size="9" fill="#86198f">cache.t4g.micro</text>

  <!-- SQS -->
  <rect x="50" y="675" width="240" height="80" rx="6" fill="#fae8ff" stroke="#d946ef" stroke-width="1" filter="url(#shadow)"/>
  <text x="170" y="693" text-anchor="middle" font-size="10" font-weight="600" fill="#701a75">SQS — Notification Queue</text>
  <text x="170" y="707" text-anchor="middle" font-size="9" fill="#86198f">Standard queue for status-change events</text>
  <text x="170" y="721" text-anchor="middle" font-size="9" fill="#86198f">Dead-letter queue (DLQ) after 3 retries</text>
  <text x="170" y="735" text-anchor="middle" font-size="9" fill="#86198f">Lambda consumer → SES email / SNS SMS</text>

  <!-- S3 / Documents -->
  <rect x="310" y="675" width="240" height="80" rx="6" fill="#fae8ff" stroke="#d946ef" stroke-width="1" filter="url(#shadow)"/>
  <text x="430" y="693" text-anchor="middle" font-size="10" font-weight="600" fill="#701a75">S3 Buckets</text>
  <text x="430" y="707" text-anchor="middle" font-size="9" fill="#86198f">claims-documents  (presigned upload URLs)</text>
  <text x="430" y="721" text-anchor="middle" font-size="9" fill="#86198f">frontend-assets  (static SPA, CloudFront)</text>
  <text x="430" y="735" text-anchor="middle" font-size="9" fill="#86198f">Versioning enabled  ·  SSE-KMS encryption</text>

  <!-- ── Supporting Services (right column) ── -->
  <rect x="590" y="235" width="570" height="540" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="875" y="254" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">SUPPORTING SERVICES</text>

  <!-- CI/CD -->
  <rect x="605" y="263" width="250" height="110" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" filter="url(#shadow)"/>
  <text x="730" y="281" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">CI/CD Pipeline</text>
  <text x="730" y="295" text-anchor="middle" font-size="9" fill="#166534">GitHub Actions on push to main</text>
  <text x="730" y="309" text-anchor="middle" font-size="9" fill="#166534">1. npm test (Jest)  2. Docker build</text>
  <text x="730" y="323" text-anchor="middle" font-size="9" fill="#166534">3. Push to ECR  4. ECS rolling deploy</text>
  <text x="730" y="337" text-anchor="middle" font-size="9" fill="#166534">5. Smoke test /health endpoint</text>
  <text x="730" y="351" text-anchor="middle" font-size="9" fill="#166534">Blue/green optional via CodeDeploy</text>

  <!-- Observability -->
  <rect x="870" y="263" width="275" height="110" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1" filter="url(#shadow)"/>
  <text x="1007" y="281" text-anchor="middle" font-size="10" font-weight="600" fill="#c2410c">Observability</text>
  <text x="1007" y="295" text-anchor="middle" font-size="9" fill="#9a3412">CloudWatch Logs: ECS container stdout</text>
  <text x="1007" y="309" text-anchor="middle" font-size="9" fill="#9a3412">CloudWatch Metrics: CPU, memory, RDS</text>
  <text x="1007" y="323" text-anchor="middle" font-size="9" fill="#9a3412">CloudWatch Alarms → SNS → PagerDuty</text>
  <text x="1007" y="337" text-anchor="middle" font-size="9" fill="#9a3412">X-Ray tracing for API latency</text>
  <text x="1007" y="351" text-anchor="middle" font-size="9" fill="#9a3412">Dashboard: error rate, p95 latency, queue depth</text>

  <!-- Security -->
  <rect x="605" y="390" width="250" height="130" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" filter="url(#shadow)"/>
  <text x="730" y="408" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Security</text>
  <text x="730" y="422" text-anchor="middle" font-size="9" fill="#7f1d1d">IAM roles with least-privilege policies</text>
  <text x="730" y="436" text-anchor="middle" font-size="9" fill="#7f1d1d">Secrets Manager: DB password, JWT secret</text>
  <text x="730" y="450" text-anchor="middle" font-size="9" fill="#7f1d1d">VPC Security Groups: port 5432 ECS-only</text>
  <text x="730" y="464" text-anchor="middle" font-size="9" fill="#7f1d1d">WAF: SQL injection, XSS, rate limit rules</text>
  <text x="730" y="478" text-anchor="middle" font-size="9" fill="#7f1d1d">KMS CMK: RDS + S3 encryption at rest</text>
  <text x="730" y="492" text-anchor="middle" font-size="9" fill="#7f1d1d">ACM certificate for HTTPS on ALB</text>
  <text x="730" y="506" text-anchor="middle" font-size="9" fill="#7f1d1d">GuardDuty + Security Hub enabled</text>

  <!-- Notifications Lambda -->
  <rect x="870" y="390" width="275" height="130" rx="6" fill="#fdf4ff" stroke="#e879f9" stroke-width="1" filter="url(#shadow)"/>
  <text x="1007" y="408" text-anchor="middle" font-size="10" font-weight="600" fill="#701a75">Async Notifications (Lambda)</text>
  <text x="1007" y="422" text-anchor="middle" font-size="9" fill="#86198f">Triggered by SQS claim-status-changes</text>
  <text x="1007" y="436" text-anchor="middle" font-size="9" fill="#86198f">APPROVED → SES email to customer</text>
  <text x="1007" y="450" text-anchor="middle" font-size="9" fill="#86198f">REJECTED → SES email with reason</text>
  <text x="1007" y="464" text-anchor="middle" font-size="9" fill="#86198f">PAID     → SNS push notification</text>
  <text x="1007" y="478" text-anchor="middle" font-size="9" fill="#86198f">DLQ alerts to CloudWatch on failure</text>
  <text x="1007" y="492" text-anchor="middle" font-size="9" fill="#86198f">Idempotency key prevents duplicate sends</text>

  <!-- Audit / Compliance -->
  <rect x="605" y="540" width="250" height="110" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" filter="url(#shadow)"/>
  <text x="730" y="558" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Audit &amp; Compliance</text>
  <text x="730" y="572" text-anchor="middle" font-size="9" fill="#1e3a8a">audit_log table: who changed what, when</text>
  <text x="730" y="586" text-anchor="middle" font-size="9" fill="#1e3a8a">CloudTrail: all AWS API calls logged</text>
  <text x="730" y="600" text-anchor="middle" font-size="9" fill="#1e3a8a">S3 access logs for document downloads</text>
  <text x="730" y="614" text-anchor="middle" font-size="9" fill="#1e3a8a">RDS parameter log_statement = all</text>
  <text x="730" y="628" text-anchor="middle" font-size="9" fill="#1e3a8a">Immutable log retention: 90 days</text>

  <!-- Backup -->
  <rect x="870" y="540" width="275" height="110" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" filter="url(#shadow)"/>
  <text x="1007" y="558" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Backup &amp; DR</text>
  <text x="1007" y="572" text-anchor="middle" font-size="9" fill="#166534">RDS automated daily snapshots (7 days)</text>
  <text x="1007" y="586" text-anchor="middle" font-size="9" fill="#166534">Cross-region snapshot copy to us-west-2</text>
  <text x="1007" y="600" text-anchor="middle" font-size="9" fill="#166534">S3 cross-region replication enabled</text>
  <text x="1007" y="614" text-anchor="middle" font-size="9" fill="#166534">RTO: 30 min  ·  RPO: 24 hours</text>
  <text x="1007" y="628" text-anchor="middle" font-size="9" fill="#166534">Route 53 failover routing policy</text>

  <!-- Document Storage detail -->
  <rect x="605" y="668" width="540" height="100" rx="6" fill="#fef9c3" stroke="#fde68a" stroke-width="1" filter="url(#shadow)"/>
  <text x="875" y="686" text-anchor="middle" font-size="10" font-weight="600" fill="#713f12">Document Storage Flow</text>
  <text x="875" y="700" text-anchor="middle" font-size="9" fill="#92400e">1. Client requests presigned PUT URL from API  →  2. API calls S3.createPresignedPost (60s TTL)</text>
  <text x="875" y="714" text-anchor="middle" font-size="9" fill="#92400e">3. Client uploads directly to S3 (bypasses backend)  →  4. S3 event triggers Lambda to record metadata in RDS</text>
  <text x="875" y="728" text-anchor="middle" font-size="9" fill="#92400e">5. Retrieval: API generates presigned GET URL (15min TTL)  —  files never served through application servers</text>
  <text x="875" y="742" text-anchor="middle" font-size="9" fill="#92400e">Bucket policy: deny public access  ·  Object lifecycle: Glacier after 1 year</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- FLOW ARROWS -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Users → Edge -->
  <line x1="180" y1="130" x2="198" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Edge → ALB -->
  <line x1="290" y1="186" x2="290" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="250" x2="170" y2="262" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ALB → ECS -->
  <line x1="170" y1="351" x2="170" y2="412" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ECS → RDS -->
  <line x1="170" y1="523" x2="170" y2="582" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ECS → Redis (dashed) -->
  <line x1="290" y1="468" x2="310" y2="623" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>

  <!-- ECS → SQS -->
  <line x1="170" y1="523" x2="170" y2="674" stroke="#9333ea" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ALB → S3 (static) -->
  <line x1="290" y1="307" x2="430" y2="307" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="430" y1="307" x2="430" y2="674" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- SQS → Lambda -->
  <line x1="290" y1="715" x2="869" y2="455" stroke="#9333ea" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- LEGEND -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="20" y="800" width="1160" height="48" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="818" font-size="10" font-weight="600" fill="#475569">Legend:</text>
  <line x1="100" y1="815" x2="130" y2="815" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="135" y="819" font-size="10" fill="#475569">Synchronous request</text>
  <line x1="260" y1="815" x2="290" y2="815" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="295" y="819" font-size="10" fill="#475569">Async / event-driven</text>
  <line x1="430" y1="815" x2="460" y2="815" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="465" y="819" font-size="10" fill="#475569">Static asset / CDN</text>
  <rect x="600" y="808" width="12" height="12" rx="2" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="618" y="819" font-size="10" fill="#475569">Public subnet</text>
  <rect x="700" y="808" width="12" height="12" rx="2" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="718" y="819" font-size="10" fill="#475569">Private app subnet</text>
  <rect x="820" y="808" width="12" height="12" rx="2" fill="#fae8ff" stroke="#d946ef" stroke-width="1"/>
  <text x="838" y="819" font-size="10" fill="#475569">Private data subnet</text>

  <text x="40" y="840" font-size="10" font-weight="600" fill="#475569">AZs:</text>
  <text x="65" y="840" font-size="10" fill="#475569">All stateful resources (RDS, Redis, ECS tasks) span 2 availability zones for fault tolerance. Route 53 health checks enable automatic failover.</text>
</svg>
